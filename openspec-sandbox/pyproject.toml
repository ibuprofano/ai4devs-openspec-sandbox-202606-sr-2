[project]
name = "text2gherkin"
version = "0.1.0"
description = "Convert free-form text describing user actions into BDD/Gherkin feature files"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.0.0",
    "gherkin-official>=24.0.0",
    "typer>=0.12.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
text2gherkin = "text2gherkin.adapters.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
